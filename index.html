<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VULCAN | OPEN SHARE</title>
    <style>
        :root { --neon-blue: #00d4ff; --cyber-dark: #05050b; --border: rgba(0, 212, 255, 0.2); }
        body { background: var(--cyber-dark); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        header { width: 100%; padding: 30px; text-align: center; border-bottom: 1px solid var(--border); background: rgba(10, 10, 20, 0.9); }
        .upload-box { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 15px; border: 1px dashed var(--neon-blue); margin: 40px 0; width: 400px; text-align: center; }
        .file-list { width: 90%; max-width: 800px; }
        .file-item { background: #111; border: 1px solid var(--border); padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .dl-link { color: var(--neon-blue); text-decoration: none; font-weight: bold; border: 1px solid var(--neon-blue); padding: 5px 15px; border-radius: 5px; }
        button { background: var(--neon-blue); color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #progress-bar { width: 100%; height: 5px; background: #222; margin-top: 10px; display: none; }
        #progress-fill { width: 0%; height: 100%; background: var(--neon-blue); }
    </style>
</head>
<body>

    <header>
        <h1 style="color: var(--neon-blue); letter-spacing: 5px;">VULCAN_SHARE</h1>
        <p style="color: #555;">PUBLIC VIDEO & IMAGE UPLINK</p>
    </header>

    <div class="upload-box">
        <h3>UPLOAD CONTENT</h3>
        <input type="file" id="file-picker" style="margin-bottom: 15px;">
        <button onclick="uploadFile()">START UPLOAD</button>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <p id="status" style="font-size: 12px; margin-top: 10px;"></p>
    </div>

    <div class="file-list">
        <h2 style="color: var(--neon-blue);">RECENT UPLOADS</h2>
        <div id="files">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);

        window.uploadFile = function() {
            const file = document.getElementById('file-picker').files[0];
            if (!file) return alert("Select a file!");

            const storageRef = ref(storage, 'uploads/' + file.name);
            const uploadTask = uploadBytesResumable(storageRef, file);

            document.getElementById('progress-bar').style.display = 'block';

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    document.getElementById('progress-fill').style.width = progress + '%';
                }, 
                (error) => { alert("Upload Failed!"); }, 
                () => {
                    getDownloadURL(uploadTask.snapshot.ref).then((url) => {
                        document.getElementById('status').innerText = "Upload Complete!";
                        loadFiles(); // Refresh list
                    });
                }
            );
        };

        async function loadFiles() {
            const listRef = ref(storage, 'uploads/');
            const res = await listAll(listRef);
            const container = document.getElementById('files');
            container.innerHTML = "";

            for (const item of res.items) {
                const url = await getDownloadURL(item);
                container.innerHTML += `
                    <div class="file-item">
                        <span>${item.name}</span>
                        <a href="${url}" class="dl-link" target="_blank" download>DOWNLOAD</a>
                    </div>
                `;
            }
        }

        loadFiles();
    </script>
</body>
</html>
